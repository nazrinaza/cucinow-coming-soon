<style>
  :root{
    --blue:#8378F8;
    --blue-soft:rgba(131,120,248,.5);
    --gold:#F8B800;
    --bg:#0B0D14;
    --ink:#EAE8F4;
    --dim:#8A8DA0;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}

      radial-gradient(1200px 800px at 50% 38%, #141726 0%, var(--bg) 62%),
      var(--bg);

    overflow:hidden;
    -webkit-font-smoothing:antialiased;

    -webkit-mask-size:contain;mask-size:contain;
    -webkit-mask-position:center bottom;mask-position:center bottom;
    -webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;
    mix-blend-mode:screen;
    pointer-events:none;
    animation:sheen 7s 2.4s ease-in-out infinite;
  }
  @keyframes rise{
    from{opacity:0;transform:translateY(26px) scale(.96)}
    to{opacity:1;transform:none}
  }
  @keyframes float{
    0%,100%{transform:translateY(0)}
    50%{transform:translateY(-11px)}
  }
  @keyframes sheen{
    0%,64%{background-position:120% 0}
    86%,100%{background-position:-40% 0}
  }

  .divider{
    width:0;height:1px;
    margin:34px 0 26px;
    background:linear-gradient(90deg,transparent,var(--blue),transparent);
    animation:grow 1.1s 1.05s cubic-bezier(.2,.7,.2,1) forwards;
    box-shadow:0 0 14px var(--blue-soft);
  }
  @keyframes grow{to{width:min(62vw,340px)}}

  .tagline{
    font-weight:500;
    font-size:clamp(15px,2.6vw,22px);
    letter-spacing:.22em;
    text-transform:uppercase;
    text-wrap:balance;
  }
  .tagline .w{
    display:inline-block;
    opacity:0;transform:translateY(14px);
    animation:word .7s cubic-bezier(.2,.7,.2,1) forwards;
  }
  .tagline .w:nth-child(1){animation-delay:1.35s}
  .tagline .w:nth-child(2){animation-delay:1.47s}
  .tagline .w:nth-child(3){animation-delay:1.59s}
  .tagline .w:nth-child(4){animation-delay:1.71s}
  .tagline .accent{color:var(--blue)}
  @keyframes word{to{opacity:1;transform:none}}

  .sub{
    margin-top:14px;
    font-size:clamp(11px,1.5vw,13px);
    letter-spacing:.34em;
    text-transform:uppercase;
    color:var(--dim);
    opacity:0;
    animation:fade .8s 2.05s forwards;
  }
  .mail{
    margin-top:26px;
    display:inline-block;
    font-size:clamp(13px,1.8vw,15px);
    letter-spacing:.08em;
    color:var(--blue);
    text-decoration:none;
    border-bottom:1px solid transparent;
    padding-bottom:2px;
    opacity:0;
    animation:fade .8s 2.3s forwards;
    transition:border-color .25s ease,color .25s ease;
  }
  .mail:hover{border-color:var(--blue-soft)}
  @keyframes fade{to{opacity:1}}

  footer{
    position:fixed;left:0;right:0;bottom:18px;
    text-align:center;
    font-size:11px;letter-spacing:.22em;text-transform:uppercase;
    color:#565A6E;
    z-index:1;
    opacity:0;animation:fade 1s 2.7s forwards;
  }

  @media (max-width:480px){
    .logo{height:min(38vh,230px)}
    .tagline{letter-spacing:.16em}
  }
  @media (prefers-reduced-motion:reduce){
    .logo-wrap,.sheen,.divider,.tagline .w,.sub,.mail,footer{
      animation:none!important;opacity:1!important;transform:none!important;
    }
    .divider{width:min(62vw,340px)}
    .sheen{display:none}
  }
</style>

<script>
(() => {
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const coarse = matchMedia('(pointer: coarse)').matches;

  // ---- dust field ----
  const cv = document.getElementById('dust');
  const ctx = cv.getContext('2d');
  let W, H, DPR, parts = [];
  function resize(){
    DPR = Math.min(devicePixelRatio || 1, 2);
    W = innerWidth; H = innerHeight;
    cv.width = W * DPR; cv.height = H * DPR;
    cv.style.width = W + 'px'; cv.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    const n = Math.round(Math.min(90, W * H / 22000));
    parts = Array.from({length:n}, () => spawn(true));
  }
  function spawn(anywhere){
    const kind = Math.random();
    return {
      x: Math.random() * W,
      y: anywhere ? Math.random() * H : H + 8,
      r: .6 + Math.random() * 1.5,
      v: 8 + Math.random() * 20,
      sway: Math.random() * Math.PI * 2,
      swaySpd: .2 + Math.random() * .5,
      a: .04 + Math.random() * .16,
      col: kind < .5 ? '139,128,250' : (kind < .85 ? '226,230,255' : '248,184,0')
    };
  }
  let last = performance.now(), running = true;
  function frame(now){
    if(!running){ last = now; requestAnimationFrame(frame); return; }
    const dt = Math.min(.05, (now - last) / 1000); last = now;
    ctx.clearRect(0, 0, W, H);
    for(let i = 0; i < parts.length; i++){
      const p = parts[i];
      p.y -= p.v * dt;
      p.sway += p.swaySpd * dt;
      p.x += Math.sin(p.sway) * 6 * dt;
      if(p.y < -10){ parts[i] = spawn(false); continue; }
      const tw = p.a * (0.7 + 0.3 * Math.sin(p.sway * 2.3));
      ctx.beginPath();
      ctx.fillStyle = `rgba(${p.col},${tw})`;
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fill();
    }
    requestAnimationFrame(frame);
  }
  resize();
  addEventListener('resize', resize);
  document.addEventListener('visibilitychange', () => { running = !document.hidden; });
  if(!reduced) requestAnimationFrame(frame);

  // ---- gentle parallax tilt on the logo ----
  if(!reduced && !coarse){
    const tilt = document.getElementById('tilt');
    let tx = 0, ty = 0, cx = 0, cy = 0;
    addEventListener('mousemove', e => {
      const nx = e.clientX / innerWidth - .5;
      const ny = e.clientY / innerHeight - .5;
      tx = nx * -7; ty = ny * 6;
    });
    (function lerp(){
      cx += (tx - cx) * .06;
      cy += (ty - cy) * .06;
      tilt.style.transform = `rotateX(${cy.toFixed(2)}deg) rotateY(${cx.toFixed(2)}deg)`;
      requestAnimationFrame(lerp);
    })();
  }
})();
</script>
